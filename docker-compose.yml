services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-rahanpas-server-manager-frontend}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-13000}:${NITRO_PORT:-3000}"
    environment:
      NODE_ENV: production
      NITRO_HOST: ${NITRO_HOST:-0.0.0.0}
      NITRO_PORT: ${NITRO_PORT:-3000}
      NUXT_API_INTERNAL_BASE: ${NUXT_API_INTERNAL_BASE:?NUXT_API_INTERNAL_BASE wajib diatur}
      NUXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NUXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-false}
    networks:
      - rahanpas_net

networks:
  rahanpas_net:
    name: ${DOCKER_NETWORK:-baota_net}
    external: true
